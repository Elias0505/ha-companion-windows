name: pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false   # never cancel a half-finished deploy

jobs:
  build:
    name: Build site artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The site is served from a project subpath, so absolute asset paths 404
      # (404.html is the deliberate exception and uses the full project prefix).
      - name: Guard — no absolute asset paths
        run: |
          ! grep -rn 'src="/\|href="/assets\|href="/index' site/ --include='*.html'

      # The imprint ships with {{...}} placeholders for the provider identity.
      # While the repo is private nothing deploys, so the guard only arms itself
      # for the real thing — it must never redden the private preview builds.
      - name: Guard — imprint placeholders filled (public repo only)
        if: ${{ !github.event.repository.private }}
        run: |
          ! grep -rn '{{' site/ --include='*.html'

      # Downloadable preview — exists even while the repo is private and the
      # Pages deploy below is skipped.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site-preview
          path: site
          retention-days: 7

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        if: ${{ !github.event.repository.private }}
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        if: ${{ !github.event.repository.private }}
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # GitHub Pages is unavailable for private repos on the Free plan; skipping
    # cleanly keeps the run green until the repo goes public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
