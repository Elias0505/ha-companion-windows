name: build

on:
  push:
    branches: [main]
    tags: ['v*']
    # No paths-ignore here: GitHub applies push path filters to TAG pushes too,
    # and the v1.4.0 release build never fired because of them — the release had
    # to be dispatched by hand. Doc-only branch pushes now cost one windows run;
    # a release that silently doesn't build costs more.
  pull_request:
    branches: [main]
    paths-ignore:
      - 'site/**'
      - 'docs/**'
      - '**/*.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Least privilege: only the release job may write (job-level override below).
permissions:
  contents: read

jobs:
  core:
    name: Core (fast check, Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Build HaCompanion.Core
        run: dotnet build src/HaCompanion.Core/HaCompanion.Core.csproj -c Release -p:EnableWindowsTargeting=true
      - name: Test HaCompanion.Core
        run: dotnet test tests/HaCompanion.Core.Tests/HaCompanion.Core.Tests.csproj -c Release
      # install.ps1 carries a copy of uninstall.ps1 (it runs via irm|iex, so it cannot ship a
      # second file) — fail the build if the two drift apart.
      - name: Check the embedded uninstaller
        run: python3 tools/embed-uninstaller.py --check
      # Missing translation keys fall back to English silently — fail loudly instead.
      - name: Check translation completeness
        run: python3 tools/check-i18n.py

  app:
    name: App (WinUI 3, Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Restore (locked)
        run: dotnet restore --locked-mode
      - name: Publish (self-contained, win-x64)
        run: dotnet publish src/HaCompanion.App/HaCompanion.App.csproj -c Release -r win-x64 -p:Platform=x64 --no-restore -o publish
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: HaCompanion-win-x64
          path: publish

  release:
    name: Release (on v* tags)
    # Both gates: a release must never ship while Core tests, the uninstaller
    # embed check or the i18n check are red.
    needs: [core, app]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: HaCompanion-win-x64
          path: publish
      - name: Zip + checksums
        shell: pwsh
        run: |
          $zip = "HaCompanion-${{ github.ref_name }}-win-x64.zip"
          Compress-Archive -Path publish/* -DestinationPath $zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToUpperInvariant()
          "$hash  $zip" | Out-File SHA256SUMS.txt -Encoding ascii
          $hash          | Out-File "$zip.sha256" -Encoding ascii
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            HaCompanion-${{ github.ref_name }}-win-x64.zip
            HaCompanion-${{ github.ref_name }}-win-x64.zip.sha256
            SHA256SUMS.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
