name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core:
    name: Core (fast check, Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Build HaCompanion.Core
        run: dotnet build src/HaCompanion.Core/HaCompanion.Core.csproj -c Release -p:EnableWindowsTargeting=true
      - name: Test HaCompanion.Core
        run: dotnet test tests/HaCompanion.Core.Tests/HaCompanion.Core.Tests.csproj -c Release

  app:
    name: App (WinUI 3, Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore
        run: dotnet restore
      - name: Publish (self-contained, win-x64)
        run: dotnet publish src/HaCompanion.App/HaCompanion.App.csproj -c Release -r win-x64 -p:Platform=x64 -p:PublishReadyToRun=true -o publish
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HaCompanion-win-x64
          path: publish

  release:
    name: Release (on v* tags)
    needs: app
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: HaCompanion-win-x64
          path: publish
      - name: Zip
        run: Compress-Archive -Path publish/* -DestinationPath HaCompanion-${{ github.ref_name }}-win-x64.zip
        shell: pwsh
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: HaCompanion-${{ github.ref_name }}-win-x64.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
